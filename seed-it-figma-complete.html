<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Seed It - Dari setiap transaksi, lahir sebuah aksi.">
<title>Seed It | Green Marketplace</title>
<style>
:root{
 --green:#87c34a;--green2:#69a63a;--dark:#456f28;--cream:#f1ecdc;
 --line:#8bc54f;--gold:#f3c900;--text:#426a28;--shadow:0 10px 25px rgba(62,93,34,.18);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
a{text-decoration:none;color:inherit}
.header{height:58px;background:var(--green);display:flex;align-items:center;padding:0 4.5%;gap:18px;box-shadow:0 2px 5px #7775;position:sticky;top:0;z-index:100}
.coin{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;font-size:31px;filter:drop-shadow(1px 2px 1px #5555)}
.search{height:38px;width:245px;border:0;border-radius:6px;padding:0 14px;outline:none;background:#fff;color:#555}
.nav{margin-left:auto;display:flex;align-items:center;gap:18px;color:white;font-weight:600}
.nav a{font-size:15px}.nav a:hover{text-decoration:underline}
.round{width:37px;height:37px;border:2px solid var(--dark);border-radius:50%;background:#edf1d8;color:var(--dark);font-size:18px}
.cart-wrap{position:relative}.badge{position:absolute;right:-5px;top:-5px;background:white;color:var(--dark);font-size:10px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center}
.page{min-height:calc(100vh - 58px)}
.hero{height:305px;display:grid;grid-template-columns:56% 44%;overflow:hidden}
.hero-img{background:
linear-gradient(90deg,#173e17b8,#173e1740),
url("https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1200&q=85") center/cover}
.hero-copy{padding:78px 5%;color:#fff;max-width:540px}
.hero-copy h1{font-size:25px;margin:0 0 8px;line-height:1.15}
.hero-copy p{font-size:10px;line-height:1.35;margin:0;max-width:420px}
.brand{background:var(--cream);display:grid;place-items:center;text-align:center}
.brand h1,.footer-brand h1{font-family:Georgia,serif;font-weight:500;color:#667346;font-size:52px;margin:0;line-height:.8}
.brand h1:after,.footer-brand h1:after{content:"🌱";font-size:27px;vertical-align:top}
.tagline{font:italic 11px Georgia,serif;color:#617044;margin-top:9px}
.section{padding:18px 5% 32px}.rounded-top{border-radius:25px 25px 0 0}
.white-section{background:#fff}.cream-section{background:var(--cream)}
.title{text-align:center;font-size:16px;color:var(--dark);margin:0 0 10px}
.rule{height:2px;background:var(--dark);width:230px;margin:0 auto 16px}
.picks{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;max-width:760px;margin:auto}
.card{border:1px solid #b7d98d;border-radius:9px;background:#fff;padding:8px;box-shadow:var(--shadow);transition:.2s}
.card:hover{transform:translateY(-3px)}
.prod-img{height:76px;border-radius:4px;background:#f4df70;overflow:hidden}
.prod-img img{width:100%;height:100%;object-fit:cover}
.card h4{font-size:9px;margin:6px 0 3px}.price{font-size:10px;margin-bottom:2px}.stars{color:var(--gold);font-size:11px;letter-spacing:1px}
.mini-actions{display:flex;gap:4px;margin-top:6px}.mini-actions button{border:0;background:var(--green);color:#fff;border-radius:4px;padding:4px;font-size:8px;flex:1}
.impact{background:var(--cream);padding:25px 6% 30px}
.impact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:45px;max-width:850px;margin:auto;text-align:center}
.impact-icon{font-size:31px;color:#ffc900}.impact-num{font-size:23px;font-weight:bold;color:var(--green2);margin:5px}
.impact p{font-size:10px;font-style:italic;line-height:1.4;margin:0}
.footer{background:var(--green);min-height:112px;padding:14px 7%;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;color:white}
.footer-brand h1{font-size:42px;color:#5b703c}.footer-brand .tagline{color:#58703d}
.footer-nav{display:flex;justify-content:center;gap:15px;font-size:10px}.footer-help{text-align:right;font-size:9px;line-height:1.7}
.catalog-page{background:#fff;min-height:calc(100vh - 58px)}
.toolbar{background:var(--cream);padding:7px 10px;display:flex;gap:8px;align-items:center;font-size:8px}
.sort-btn{border:0;background:white;color:var(--green2);padding:5px 12px;border-radius:3px;box-shadow:0 1px 3px #aaa5}
.catalog-layout{display:grid;grid-template-columns:95px 1fr;gap:10px;padding:12px 4%}
.filters{font-size:8px;color:#555}.filters strong{display:block;margin:9px 0 6px}.filters label{display:block;margin:7px 0}
.catalog-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:13px}
.detail-page,.checkout-page,.impact-page,.profile-page{background:#fff;min-height:calc(100vh - 58px);padding:35px 5%}
.detail-box,.checkout-box{border:2px solid #cbe5a8;border-radius:27px;box-shadow:var(--shadow);max-width:520px;margin:auto;padding:28px}
.detail-main{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center}
.detail-main .prod-img{height:150px}.detail-main h2{font-size:15px}.detail-main p{font-size:12px}.qty{display:flex;align-items:center;gap:5px}.qty button{border:0;background:var(--green);color:white;width:24px;height:24px;border-radius:2px}
.checkout-box{max-width:600px}.fieldbar{border:1px solid var(--green);border-radius:6px;text-align:center;padding:9px;color:var(--green2);font-weight:bold;margin-bottom:15px;box-shadow:var(--shadow)}
.checkout-product{display:grid;grid-template-columns:100px 1fr 55px;gap:15px;align-items:center}.checkout-product .prod-img{height:75px}.checkout-product h3{font-size:15px}.delivery,.donate{margin:15px 0;border:1px solid var(--green);border-radius:6px;padding:10px;text-align:center;color:var(--green2);box-shadow:var(--shadow)}
.pay-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.pay{background:var(--green);border:0;color:#fff;padding:10px 20px;border-radius:6px;box-shadow:var(--shadow)}
.review{margin:35px auto 0;max-width:520px;border:1px solid var(--green);border-radius:20px;padding:18px}.review h3{text-align:center;font-size:13px;border-bottom:2px solid var(--dark);padding-bottom:7px}.review input{border:1px solid #bbb;border-radius:6px;height:24px}
.impact-page{padding:0;background:#fff}.impact-hero{display:grid;grid-template-columns:45% 55%;background:#fff}.impact-hero img{width:100%;height:145px;object-fit:cover}.impact-hero-text{padding:20px 25px}.impact-hero-text h2{font-size:16px;margin:0}.impact-hero-text p{font-size:9px;line-height:1.4}.impact-page .title{margin:15px}
.impact-item{display:grid;grid-template-columns:1fr 100px 1fr;gap:18px;align-items:center;max-width:850px;margin:18px auto;padding:0 25px}.impact-item:nth-child(even){grid-template-columns:1fr 100px 1fr}.impact-item .text{font-size:8px;line-height:1.4}.impact-count{text-align:center}.impact-count .impact-icon{font-size:24px}.green-box{background:var(--green);border-radius:9px;padding:14px;color:white;box-shadow:var(--shadow);font-size:8px;line-height:1.8}
.join-link{text-align:center;margin:30px;font-size:10px;color:var(--green2);font-weight:bold}
.profile-page{display:grid;place-items:center}.profile-card{width:min(420px,100%);background:var(--cream);border-radius:45px;padding:45px 30px 30px;box-shadow:var(--shadow);text-align:center;position:relative}.profile-icon{width:58px;height:58px;border:3px solid var(--dark);border-radius:50%;position:absolute;top:-29px;left:calc(50% - 29px);background:#fff;display:grid;place-items:center;font-size:30px}.profile-card p{text-align:left;margin:18px 0;color:var(--green2);font-size:12px}.profile-card button{background:var(--green);color:#fff;border:0;border-radius:6px;padding:9px 34px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:200;padding:20px}.modal.open{display:flex}.modal-card{background:var(--cream);width:min(560px,100%);border:2px solid var(--green);border-radius:35px;padding:28px;box-shadow:0 20px 60px #0005;position:relative}.close{position:absolute;right:16px;top:10px;border:0;background:transparent;font-size:28px;color:var(--dark)}.modal-card h2{text-align:center;margin:0 0 10px;font-size:20px;border-bottom:2px solid var(--dark);padding-bottom:8px}.form{display:grid;gap:9px;max-width:245px;margin:auto}.form input,.form textarea{border:1px solid #a6b88d;background:#f4f0e4;border-radius:10px;padding:7px 10px;font-size:9px;outline:none}.form textarea{min-height:60px}.form button{border:0;background:var(--green);color:white;border-radius:6px;padding:8px;margin:8px auto 0}.signin-buttons{display:flex;gap:12px;justify-content:center;margin-top:8px}.signin-buttons button{border:1px solid #b4cc91;background:#fff;border-radius:5px;padding:8px 18px;color:var(--green2)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--dark);color:#fff;padding:12px 16px;border-radius:8px;display:none;z-index:500;font-size:11px}
@media(max-width:800px){
 .header{gap:8px;padding:0 12px}.search{width:150px}.nav{gap:8px}.nav a{font-size:11px}.coin{width:35px}
 .hero{grid-template-columns:1fr;height:auto}.hero-img{height:260px}.brand{height:145px}
 .picks{grid-template-columns:repeat(3,1fr)}.catalog-layout{grid-template-columns:65px 1fr}.catalog-grid{grid-template-columns:repeat(3,1fr)}
 .footer{grid-template-columns:1fr;text-align:center;gap:12px}.footer-help{text-align:center}.impact-grid{gap:12px}
 .impact-item{grid-template-columns:1fr!important;text-align:center}.green-box{max-width:250px;margin:auto}
}
@media(max-width:500px){
 .nav a{display:none}.search{width:130px}.picks,.catalog-grid{grid-template-columns:repeat(2,1fr)}.detail-main{grid-template-columns:1fr}.checkout-product{grid-template-columns:75px 1fr}.checkout-product .qty{grid-column:2}
}
</style>
</head>
<body>

<header class="header">
 <a class="coin" href="#home" onclick="go('home')">🪙</a>
 <input id="search" class="search" placeholder="⌕   Search Products . . ." oninput="filterProducts(this.value)">
 <nav class="nav">
  <a href="#home" onclick="go('home')">Home</a>
  <a href="#catalog" onclick="go('catalog')">Catalog</a>
  <a href="#join" onclick="openModal('signinModal')">Join Us</a>
  <a href="#contact" onclick="showToast('Kontak Seed It siap membantu.')">Contact</a>
  <span class="cart-wrap"><button class="round" onclick="go('checkout')">🛒</button><span id="badge" class="badge">0</span></span>
  <button class="round" onclick="openModal('signinModal')">♙</button>
 </nav>
</header>

<main id="app"></main>

<footer class="footer">
 <div class="footer-brand"><h1>Seed It</h1><div class="tagline">“Dari setiap transaksi, lahir sebuah aksi”</div></div>
 <div class="footer-nav"><a href="#home" onclick="go('home')">Home</a><a href="#catalog" onclick="go('catalog')">Catalog</a><a href="#join" onclick="openModal('signinModal')">Join Us</a><a href="#contact">Contact</a></div>
 <div class="footer-help">Perlu bantuan?<br>Beri saran & masukan<br>Mulai berjualan</div>
</footer>

<div id="modal" class="modal" onclick="outside(event)">
 <div id="modalCard" class="modal-card"></div>
</div>
<div id="toast" class="toast"></div>

const products=Array.from({length:30},(_,i)=>({
 id:i+1,name:"Nama Produk",price:"Rp--.---,-",rating:5,
 category:i%3===0?"Top Choice":"New Arrival",
 description:"Produk pilihan Seed It yang mendukung transaksi lebih bertanggung jawab terhadap lingkungan."
}));
let cart=JSON.parse(localStorage.getItem("seed-it-cart")||"[]");
let selected=1;

function header(){document.getElementById("badge").textContent=cart.reduce((a,x)=>a+x.qty,0)}
function stars(n=5){return "★".repeat(n)+"☆".repeat(5-n)}
function productCard(p,detail=true){
 return `<article class="card">
   <div class="prod-img"><img src="${img}" alt="${p.name}"></div>
   <h4>${p.name}</h4><div class="price">${p.price}</div><div class="stars">${stars(p.rating)}</div>
   ${detail?`<div class="mini-actions"><button onclick="go('detail',${p.id})">Detail</button><button onclick="add(${p.id})">+</button></div>`:""}
 </article>`;
}
function go(page,id=1){
 selected=id;
 const app=document.getElementById("app");
 if(page==="home")app.innerHTML=home();
 if(page==="catalog")app.innerHTML=catalog();
 if(page==="detail")app.innerHTML=detail(id);
 if(page==="checkout")app.innerHTML=checkout();
 if(page==="impact")app.innerHTML=impact();
 if(page==="profile")app.innerHTML=profile();
 window.scrollTo({top:0,behavior:"smooth"});header();
}
function home(){
 return `<div class="page" id="home">
 <section class="hero"><div class="hero-img"><div class="hero-copy"><h1>Belanja mudah, belanja hijau, mulai dari sekarang!</h1><p>“Aku memilih produk ramah lingkungan, karena aku berkontribusi terhadap lingkungan melalui setiap transaksi yang kulakukan.”</p></div></div><div class="brand"><div><h1>Seed It</h1><div class="tagline">“Dari setiap transaksi, lahir sebuah aksi”</div></div></div></section>
 <section class="section white-section rounded-top"><h2 class="title">Our Picks</h2><div class="rule"></div><div class="picks">${products.slice(0,6).map(productCard).join("")}</div></section>
 <section class="impact"><h2 class="title">Bukti Nyata</h2><div class="impact-grid"><div><div class="impact-icon">📦</div><div class="impact-num">000</div><p>Produk telah sampai ke<br>tangan konsumen.</p></div><div><div class="impact-icon">🤝</div><div class="impact-num">000</div><p>Donasi telah terkumpul.</p></div><div><div class="impact-icon">🌱</div><div class="impact-num">000</div><p>Kontribusi terhadap<br>lingkungan.</p></div></div></section>
 </div>`;
}
function catalog(){
 return `<div class="catalog-page"><div class="toolbar">Sort by: <button class="sort-btn" onclick="sortCatalog('price')">Price</button><button class="sort-btn" onclick="sortCatalog('new')">Newest</button></div>
 <div class="catalog-layout"><aside class="filters"><strong>Filter</strong><strong>Sort by</strong><label>Rating</label><label>★★★★★</label><label>★★★★☆</label><label>★★★☆☆</label><strong>Category</strong><label>Top Choice</label><label>New Arrival</label></aside><section><div id="catalogGrid" class="catalog-grid">${products.map(productCard).join("")}</div></section></div></div>`;
}
function filterProducts(q){
 if(location.hash!=="#catalog")go('catalog');
 const val=q.toLowerCase();const list=products.filter(p=>(p.name+" "+p.category).toLowerCase().includes(val));
 const grid=document.getElementById("catalogGrid");if(grid)grid.innerHTML=(list.length?list:products.slice(0,6)).map(productCard).join("");
}
function sortCatalog(type){showToast(type==="price"?"Produk diurutkan berdasarkan harga.":"Produk terbaru ditampilkan.");}
function detail(id){
 const p=products.find(x=>x.id===id)||products[0];
 return `<div class="detail-page"><div class="detail-box"><div class="detail-main"><div class="prod-img"><img src="${img}" alt="${p.name}"></div><div><h2>${p.name}</h2><p>Deskripsi<br>Produk</p><div class="stars">${stars(5)}</div><strong>${p.price}</strong><div class="qty" style="margin-top:6px"><button onclick="change(-1)">−</button><span id="dq">00</span><button onclick="change(1)">+</button></div><button class="pay" onclick="add(${p.id})">Check-out</button></div></div></div><div class="review"><h3>Review</h3><div style="display:flex;justify-content:center;gap:10px;align-items:center"><span class="stars">☆☆☆☆☆</span><input placeholder="insert..."></div></div></div>`;
}
function change(d){let e=document.getElementById("dq");let n=Math.max(0,Number(e.textContent)+d);e.textContent=String(n).padStart(2,"0")}
function checkout(){
 const total=cart.reduce((a,x)=>a+x.qty,0);
 return `<div class="checkout-page"><div class="checkout-box"><div class="fieldbar" onclick="openAddress()">Adress & Buyer Data</div><div class="checkout-product"><div class="prod-img"><img src="${img}" alt="Nama Produk"></div><div><h3>Nama Produk</h3><div class="stars">${stars(5)}</div></div><strong>QTY</strong></div><div class="delivery" onclick="showToast('Pilihan pengiriman dibuka.')">Delivery Option</div><div class="donate" onclick="openDonation()">Donate Now!</div><div class="pay-row"><button class="pay" onclick="payNow()">Pay Now</button><strong style="font-size:22px">Rp--.--,-</strong></div></div></div>`;
}
function impact(){
 return `<div class="impact-page"><div class="impact-hero"><img src="https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=800&q=85"><div class="impact-hero-text"><h2>Ubah Setiap Transaksi Menjadi Aksi.<br>Sekarang giliran Anda untuk<br>memberi dampak.</h2><p>Setiap langkah kecil, ketika dilakukan bersama, dapat menghasilkan perubahan yang berarti.</p></div></div><h2 class="title">Bukti Nyata</h2>
 ${impactRow("📦","Produk telah sampai ke tangan konsumen.","Pohon tertanam","Pohon pertama","Pohon pertumbuhan")}
 ${impactRow("🤝","Donasi telah terkumpul.","Pohon tertanam","Pohon pertama","Pohon pertumbuhan")}
 ${impactRow("🌱","Kontribusi terhadap lingkungan.","Pohon tertanam","Pohon pertama","Pohon pertumbuhan")}
 <div class="join-link">Sekarang giliran Anda untuk memberi dampak terhadap lingkungan.<br>Ikuti perjalanan kami lebih lanjut dan bergabung bersama kami.<br><br><a href="#join" onclick="openModal('signinModal')">Gabung bersama kami!</a></div></div>`;
}
function impactRow(icon,text,a,b,c){return `<div class="impact-item"><div class="text">${text}<br><br>Melalui kontribusi bersama, Seed It mencatat dampak nyata yang dapat dilihat dan dikembangkan.</div><div class="impact-count"><div class="impact-icon">${icon}</div><div class="impact-num">000</div><small>kontribusi</small></div><div class="green-box">○ ${a}<br>○ ${b}<br>○ ${c}</div></div>`}
function profile(){return `<div class="profile-page"><div class="profile-card"><div class="profile-icon">♙</div><p><b>Name:</b> Pulih Bersama Sejiwa</p><p><b>E-mail:</b> pulihbersamasejiwa@gmail.com</p><p><b>Address:</b> Jl. Mahabarata 77, Saranjana</p><button onclick="openAddress()">Edit</button></div></div>`}
function add(id){const x=cart.find(c=>c.id===id);if(x)x.qty++;else cart.push({id,qty:1});localStorage.setItem("seed-it-cart",JSON.stringify(cart));header();showToast("Produk ditambahkan ke keranjang.");}
function payNow(){openModal("payment","Pay Now");}
function openAddress(){openModal("address")}
function openDonation(){openModal("donation")}
function openModal(type,title){
 const m=document.getElementById("modal"),c=document.getElementById("modalCard");m.classList.add("open");
 if(type==="signin")c.innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>Sign In</h2><div class="form"><input placeholder="E-mail"><input placeholder="Password"><input placeholder="Confirm Password"><input placeholder="Phone Number"><div class="signin-buttons"><button onclick="showToast('Akun buyer dibuat dalam mode demo.');closeModal()">Be Buyer</button><button onclick="showToast('Mode seller dibuka.');closeModal();openModal('seller')">Be Seller</button></div></div>`;
 if(type==="seller")c.innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>Seller</h2><div class="form"><input placeholder="E-mail"><input placeholder="Password"><input placeholder="Phone Number"><button onclick="showToast('Login seller berhasil pada mode demo.');closeModal()">Log In</button></div>`;
 if(type==="address")c.innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>Adress & Buyer Data</h2><div class="form"><input placeholder="Adress"><input placeholder="Description"><input placeholder="Buyer's Name"><input placeholder="Phone Number"><button onclick="showToast('Data pembeli disimpan.');closeModal()">Save & Buy</button></div>`;
 if(type==="donation")c.innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>Donation</h2><div class="form"><input placeholder="Nominal"><input placeholder="Description"><button onclick="showToast('Donasi tersimpan pada mode demo.');closeModal()">Save & Buy</button></div>`;
 if(type==="payment")c.innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>Payment</h2><div class="form"><input placeholder="Payment method"><input placeholder="Transaction note"><button onclick="showToast('Pembayaran berhasil pada mode demo.');closeModal()">Confirm Payment</button></div>`;
}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function outside(e){if(e.target.id==="modal")closeModal()}
function showToast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2200)}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
go("home");
</script>
</body>
</html>
